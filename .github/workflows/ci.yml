name: CI

on:
  push:
  pull_request:

jobs:
  lint-unit:
    name: Lint + Unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Unit tests + coverage gate (>= 80%)
        run: npm run test:unit
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage

  security:
    name: Security audit
    needs: lint-unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: npm audit (fail on critical)
        run: npm audit --audit-level=critical

  integration:
    name: Integration tests
    needs: security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:integration

    e2e:
      name: E2E tests (Playwright)
      needs: integration
      runs-on: ubuntu-latest
      services:
        mongo:
          image: mongo:7
          ports:
            - 27017:27017
          options: >-
            --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
            --health-interval 5s
            --health-timeout 5s
            --health-retries 10
      env:
        CI: true
        PORT: 5000
        MONGO_URL: mongodb://localhost:27017/shop_e2e
        JWT_SECRET: ci-e2e-secret
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: 22
        - name: Install backend deps
          run: npm ci
          working-directory: backend
        - name: Install e2e deps
          run: npm ci
          working-directory: e2e
        - name: Run Playwright tests
          run: npx playwright test
          working-directory: e2e
        - name: Upload Playwright report
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: playwright-report
            path: |
              e2e/playwright-report
              e2e/test-results

  build:
    name: Build
    needs: e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install production dependencies
        run: npm ci --omit=dev
      - name: Smoke check that the app loads
        run: node -e "require('./app'); console.log('build ok')"